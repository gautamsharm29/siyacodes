// 贵族权限信息
message NobleAuthority{
  int32 id = 1;
  string title = 2; // 标题
  string desc = 3; // 描述
  string icon = 4; // 图标
  string activeIcon = 7; // 激活的图标
  string detailSrc = 5; // 详情图
  string detailDesc = 6; // 详情描述
  int64 rank = 8; // 排序值
}

// 贵族价格信息
message NobleProduct {
  int32 productId = 1; // 商品id
  api.Os clientType = 10;
  int32 nobleId = 8; // 对应贵族id
  int32 days = 2; // 天数
  string price = 3; // 美元
  string iapPrice = 4; // 美元
  string iapId = 5; // iap商品id
  int64 giveCoin = 6; // 赠送金币
  int32 rank = 7; // 排序
  string showDuration = 9; // 显示时长
  string gapProductId = 11; // 谷歌商品id
  string huaweiId = 13; // 华为商品id
}

