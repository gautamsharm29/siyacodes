syntax = "proto3";
package api;
option go_package = ".;api";

import "user.proto";
import "voice_room.proto";



enum CycleType {
     ctp_none = 0;
      ctp_day = 1;
      ctp_week = 2;
      ctp_month = 3;
      ctp_history = 4; // 总榜咯
}
enum RankType {
      rkt_none = 0; // 默认值
      rkt_charm = 1; // 魅力榜
      rkt_wealth = 2; // 财富榜
      rkt_room = 3; // 房间榜
      rkt_cp = 4; // CP榜
      rkt_lucky_gift = 5; // 幸运礼物_欧皇榜
      rkt_rich_guy = 6; // 幸运礼物_土豪榜
      rkt_family = 7; // 家族榜
      rkt_love_cruise = 8; // 恋爱邮轮
      rkt_game_king = 9;// 游戏王
 }

message RankListArg {
    RankType rankType = 1;
    CycleType cycleType = 2;
    int32 current = 3; // 1当前 2 之前
    int32 page = 4;
    int32 size = 5;
    int64 roomId = 6; //

}


message RankInfo {
    int64 rank = 1;
    int64 value = 2;
    RankUser luser = 3;
    RankUser ruser = 4;
    VoiceRoom room = 5;
}

message RankBriefInfo {
    string id         =1;
	int64 score      =2;
	int64 timestamp  =3;
}

message RankListReply {
    repeated RankInfo rankList = 1;
    RankInfo selfRank = 2;
    bool hasNext = 3;
    int64 nextPos = 4;
    bool rankClick = 5;
}

message RankRoomRoundArg {
    int64 roomId = 1;
}

message RankRoomRoundReply {
    repeated string roomRankInfos = 1;
}