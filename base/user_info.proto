syntax = "proto3";
package api;
option go_package = ".;api";

import "op_enum.proto";
import "audit.proto";

message UserIds {
  repeated int64 ids = 1;//用户id
}

message UserOnlineReply {
  map<int64, bool> onlineInfo = 1;
}

message GreetingContent {
  int32 type = 1; //1文字  2图片   3语音
  string content = 2; //对应不同类型的内容
  int64  duration = 3; //语音的时长（秒）
}

message GreetingInfo {
  int64 id = 1;
  string title = 2;
  repeated GreetingContent greeting = 3;
  AuditStatus status = 4;
}


message UserGreetingReply {
  repeated GreetingInfo items = 1;
}

message UserGreetingOpArg {
  ResOp op = 1;
  int64 id = 2;
  string title = 3;
  string content = 4; //GreetingContent数组json字符串
}

message UserGreetingLocationArg {
  int64 id = 1;
  int32 location = 2;
}

message ChatGreetingReply {
  repeated string  systemGreeting = 1;
  repeated GreetingInfo userGreeting = 2;
}

message RandomNicknameReply {
  string nickname = 1;
}