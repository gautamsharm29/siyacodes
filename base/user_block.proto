syntax = "proto3";
package api;
option go_package = ".;api";

import "user.proto";

enum BlockType {
  bt_none = 0;
  bt_user = 1; //用户
  bt_moment = 2; //动态
}

message BlockArg {
  bool isUnblock = 2; //true表示解除拉黑
  BlockType targetType = 1;
  int64 targetId = 3;
}

message BlockUserListArg {
  int64 pos = 1;
  int32 size = 2;
}

message BlockUserList {
  message Item {
    User user = 1;
    int64 blockTime = 2; //拉黑时间
  }
  repeated Item items = 1;
  bool hasNext = 2;
  int64 nextPos = 3;
}