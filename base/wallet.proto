// 钱包状态
enum WalletStatus {
  wst_none = 0;
  wst_normal = 1; // 钱包状态正常
  wst_freeze = 2; // 钱包状态冻结
}

// WithdrawWay 提现方式开关
message WithdrawWay {
  bool ali = 1;
  bool wx = 2;
  bool card = 3;
}

// 钱包信息
message Wallet {
  WalletStatus status = 1; // 钱包状态
