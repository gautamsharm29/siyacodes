  int64  id = 1;
  string name = 2;
  string url = 3; //图片
  int64 duration = 4; //天数
  int64 num = 5; //数量
  int64 coin = 6; //金币
  int64 diamond = 7;//钻石
  string cornerMark = 8; //角标
}

