// 简单的用户信息
message RecordUserInfo {
  int64 id = 1;
  string nickname = 2;
  string account = 3;
  string prettyAccount = 4;
}

// 金币变动记录
message CoinRecord {
  CoinChangeType ct = 1; // 变动类型
  int64 time = 2; // 变动时间
  RecordUserInfo receiver = 3; // 用户信息
  int64 recordId = 4; // 对应id(订单或礼物id)
  int32 num = 5;
  string extName = 6; // 扩展名称
  int64 coin = 7; // 变动金币
  int64 coinBl = 8; // 金币余额
  string detail = 9; // 展示详情
}
// 积分收益记录
message PointRecord {
  PointChangeType pt = 6; // 变动类型
  int64 time = 1; // 变动时间

  string point = 11; // 变动积分

  string balance = 12; // 当前余额

  RecordUserInfo receiver = 5; // 用户信息
  int64 recordId = 7; // 对应id(订单或礼物id)
  int32 recordStatus = 13; // 对应记录状态(提现的 1:等待处理(刚发起) 2:待打款(已存在定时器) 10:打款失败 11:后台拒绝 21:成功)
  int32 num = 10;// 个数
  string extName = 9; // 扩展名称(任务名/空投名)
  string detail = 14; // 展示详情 2.2 大礼包以及以后的由服务端维护
}

message RechargeInfoArg{
  string country = 1; // country code
}

message RechargeInfoReply {
  int64 balance = 1; //用户当前余额
  repeated string lamp = 2;//跑马灯内容
  RechargeMethod lastMethod = 3;//上次使用的支付方式
  bool selectCountry = 4;//是否允许选择国家
  repeated RechargeProductWay rechargeWay = 5; //充值项
}

message RechargeProduct {
  int64 id = 1;
  int64 coin = 2;
  int64 sendCoin = 3;
  string icon = 4;//小图标
  string content = 5;//优惠文案
  string contentColor = 6;//优惠文案颜色
  string bgColor = 7;//背景颜色
  int64 updateTime = 8; //更新时间
  string minPrice = 9;
  string maxPrice = 10;
  string discounts = 11; //优惠
  string googleProductId = 12;
  string iapProductId = 13;
  string price = 14;
}

message RechargeProductWay {
  int64 id = 1;
  RechargeMethod method = 2;
  string channelName = 3;
  string channelLogo = 4;
  repeated RechargeProduct product = 5;
}

// 微信支付所需参数
message WechatPayParam {
  string appID = 1;
  string partnerID = 2;
  string prepayID = 3;
  string package = 4;
  string nonce = 5;
  string timestamp = 6;
  string sign = 7;
  string outTradeNO = 8;
}

// 预下单参数
message OrderPreArg{
  RechargeMethod method = 1; // 购买方式
  int64 productId = 2; // 套餐ID
  int64 wayId = 3;//支付方式id
  int64 productUpdateTime = 4;// 该套餐的更新时间
}

// 预下单返回值
message OrderPreReply {
  RechargeMethod method = 1; // 购买方式
  string orderNo = 2; // iap购买需要的订单号
}

// 金币变动记录
message CoinRecordArg {
  int64 pos = 1;
  int64 size = 2;
  string month = 3; // 2022-11,限定月份
}
message CoinRecordReply {
  bool hasNext = 1;
  int64 nextPos = 2;
  repeated CoinRecord records = 3;
}

// 积分收益记录
message PointRecordArg {
  int64 pos = 1;
  int64 size = 2;
  string month = 3;
}
message PointRecordReply {
  bool hasNext = 1;
  int64 nextPos = 2;
  repeated PointRecord records = 3;
}

